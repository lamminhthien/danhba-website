<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WebPhone">
<meta name="mobile-web-app-capable" content="yes">
<title>WebPhone – Cổng ứng dụng web</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235b7cff'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="phone">
  <div class="screen" id="screen">
    <div class="wallpaper" id="wall"></div>
    <div class="wallpaper" id="wallAlt"></div>
    <div class="island"></div>
    <header class="status" title="Bấm để đổi hình nền">
      <span id="clock">9:41</span>
      <span class="sys">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.4 3.5l1.1 1.2a8.7 8.7 0 0 1 6-2.4zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.2a7.1 7.1 0 0 0-9.600 0l1.1 1.2c1-.9 2.300-1.400 3.700-1.400zM8.500 9l1.600 1.800-1.600 1.200-1.600-1.200z"/></svg>
        <span class="battery"><i></i></span>
      </span>
    </header>

    <div class="pager" id="pager"></div>
    <div class="dots" id="dots"></div>
    <button class="item search-pill" id="searchBtn" style="display:flex"><span class="pill">🔍 Tìm kiếm</span></button>
    <nav class="dock" id="dock"></nav>

    <div class="folder-view" id="folderView"><h2></h2><div class="folder-grid"></div></div>
    <div class="spot" id="spot">
      <input id="q" type="search" placeholder="Tìm ứng dụng hoặc game…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="home-bar" id="homeBar" title="Về trang chủ"></div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
