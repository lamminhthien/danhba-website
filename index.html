<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Web Directory">
<meta name="mobile-web-app-capable" content="yes">
<title>Web Directory – Cổng ứng dụng web</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="phone">
  <div class="screen" id="screen">
    <div class="wallpaper" id="wall"></div>
    <div class="wallpaper" id="wallAlt"></div>
    <div class="island"></div>
    <header class="status" title="Bấm để đổi hình nền">
      <span id="clock">9:41</span>
      <span class="sys">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.4 3.5l1.1 1.2a8.7 8.7 0 0 1 6-2.4zm0 3.4c1.4 0 2.7.5 3.7 1.4l1.1-1.2a7.1 7.1 0 0 0-9.600 0l1.1 1.2c1-.9 2.300-1.400 3.700-1.400zM8.500 9l1.600 1.800-1.600 1.200-1.600-1.200z"/></svg>
        <span class="battery"><i></i></span>
      </span>
    </header>

    <button class="mode-change" id="modeChange" type="button" aria-haspopup="dialog" aria-controls="modePicker">
      <span id="modeLabel">Tất cả</span><span>Đổi chế độ</span>
    </button>

    <section class="mode-picker open" id="modePicker" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
      <div class="mode-picker-content">
        <div class="mode-heading">
          <p>WEB DIRECTORY</p>
          <h1 id="modeTitle">Chọn chế độ</h1>
          <span>Chọn danh sách bạn muốn mở</span>
        </div>
        <div class="mode-options">
          <button class="mode-option" type="button" data-mode="all" aria-pressed="false">
            <span class="mode-top"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span><span class="mode-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10.2 3.6 3.6 7.4-7.5"/></svg></span></span>
            <span class="mode-name">Tất cả</span>
            <span class="mode-description">Toàn bộ trang web và ứng dụng</span>
          </button>
          <button class="mode-option" type="button" data-mode="work" aria-pressed="false">
            <span class="mode-top"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M3 12h18m-11 0v2h4v-2"/></svg></span><span class="mode-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10.2 3.6 3.6 7.4-7.5"/></svg></span></span>
            <span class="mode-name">Công việc</span>
            <span class="mode-description">Công cụ và ứng dụng làm việc</span>
          </button>
          <button class="mode-option" type="button" data-mode="shopping" aria-pressed="false">
            <span class="mode-top"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 12H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></span><span class="mode-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10.2 3.6 3.6 7.4-7.5"/></svg></span></span>
            <span class="mode-name">Mua sắm</span>
            <span class="mode-description">Cửa hàng và chợ trực tuyến</span>
          </button>
          <button class="mode-option" type="button" data-mode="entertainment" aria-pressed="false">
            <span class="mode-top"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4V8Z"/></svg></span><span class="mode-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10.2 3.6 3.6 7.4-7.5"/></svg></span></span>
            <span class="mode-name">Giải trí</span>
            <span class="mode-description">Tin tức, mạng xã hội và phim</span>
          </button>
          <button class="mode-option" type="button" data-mode="games" aria-pressed="false">
            <span class="mode-top"><span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 8h11a4 4 0 0 1 3.8 5.2l-1 3.1a2.5 2.5 0 0 1-4.1 1.1L14 15h-4l-2.2 2.4a2.5 2.5 0 0 1-4.1-1.1l-1-3.1A4 4 0 0 1 6.5 8Z"/><path d="M7 10.5v4m-2-2h4m7-1h.01M18 14h.01"/></svg></span><span class="mode-check" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10.2 3.6 3.6 7.4-7.5"/></svg></span></span>
            <span class="mode-name">Trò chơi</span>
            <span class="mode-description">Game web, game cloud và cổng trò chơi</span>
          </button>
        </div>
      </div>
    </section>

    <div class="pager" id="pager"></div>
    <div class="dots" id="dots"></div>
    <button class="item search-pill" id="searchBtn" style="display:flex"><span class="pill">🔍 Tìm kiếm</span></button>
    <nav class="dock" id="dock"></nav>

    <div class="folder-view" id="folderView"><h2></h2><div class="folder-grid"></div></div>
    <div class="spot" id="spot">
      <input id="q" type="search" placeholder="Tìm ứng dụng hoặc game…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="home-bar" id="homeBar" title="Về trang chủ"></div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
